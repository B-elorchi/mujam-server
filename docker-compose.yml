version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mujam-api
    restart: always
    ports:
      - "4001:4001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4001
    volumes:
      - ./uploads:/app/uploads
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
