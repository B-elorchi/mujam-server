openapi: 3.0.3
info:
  title: Mujam API
  description: Language Learning Platform Backend API
  version: 1.0.0
  contact:
    name: Mujam Support
    email: support@mujam.com

servers:
  - url: http://localhost:4000
    description: Development

tags:
  - name: Auth
    description: Registration, login, tokens, password reset
  - name: Users
    description: Profile, avatar, stats
  - name: Levels
    description: Levels and sentences progress
  - name: Placement
    description: Placement test
  - name: Games
    description: Level games
  - name: Quiz
    description: Level quizzes
  - name: AI
    description: AI conversation sessions
  - name: Shadowing
    description: Stories and shadowing
  - name: Streak
    description: Streaks and achievements
  - name: Leaderboard
  - name: Notifications
  - name: Certificate
  - name: Referral
  - name: Subscription
  - name: Blog
  - name: Admin
    description: Admin-only endpoints

paths:
  /health:
    get:
      summary: Health check
      tags: []
      responses:
        '200':
          description: OK

  # ─── Auth ─────────────────────────────────────────
  /api/auth/register:
    post:
      summary: Register
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Registered
        '400':
          description: Validation or email already registered

  /api/auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Returns user, accessToken, refreshToken
        '401':
          description: Invalid credentials

  /api/auth/logout:
    post:
      summary: Logout (revoke refresh token)
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Logged out
        '401':
          description: Unauthorized

  /api/auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New accessToken (and refreshToken)
        '401':
          description: Invalid refresh token

  /api/auth/verify-email:
    post:
      summary: Verify email with code
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: Email verified
        '400':
          description: Invalid code

  /api/auth/resend-verification:
    post:
      summary: Resend verification email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Email sent
        '400':
          description: Bad request

  /api/auth/forgot-password:
    post:
      summary: Request password reset email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Reset email sent (or silent success)
        '400':
          description: Bad request

  /api/auth/reset-password:
    post:
      summary: Reset password with token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Password reset
        '400':
          description: Invalid token or validation

  /api/auth/me:
    get:
      summary: Current user (from access token)
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User object
        '401':
          description: Unauthorized

  # ─── Users ────────────────────────────────────────
  /api/users/profile:
    get:
      summary: Get profile
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User profile
        '401':
          description: Unauthorized
    patch:
      summary: Update profile
      tags: [Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '200':
          description: Updated profile
        '401':
          description: Unauthorized

  /api/users/avatar:
    post:
      summary: 'Upload avatar (multipart/form-data, field: avatar)'
      tags: [Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar: { type: string, format: binary }
      responses:
        '200':
          description: Avatar URL
        '401':
          description: Unauthorized

  /api/users/account:
    delete:
      summary: Delete account
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Account deleted
        '401':
          description: Unauthorized

  /api/users/stats:
    get:
      summary: User stats
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Stats object
        '401':
          description: Unauthorized

  /api/users/activity:
    get:
      summary: User activity
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Activity list
        '401':
          description: Unauthorized

  # ─── Levels ───────────────────────────────────────
  /api/levels:
    get:
      summary: List levels
      tags: [Levels]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of levels
        '401':
          description: Unauthorized

  /api/levels/{id}:
    get:
      summary: Get level by ID
      tags: [Levels]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Level details
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/levels/{id}/sentences:
    get:
      summary: Get sentences for level
      tags: [Levels]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sentences list
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/levels/{id}/sentences/{sentenceId}/listen:
    post:
      summary: Mark sentence as listened
      tags: [Levels]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: sentenceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/levels/{id}/sentences/{sentenceId}/complete:
    post:
      summary: Mark sentence as completed
      tags: [Levels]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: sentenceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/levels/{id}/progress:
    get:
      summary: Get progress for level
      tags: [Levels]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Progress object
        '401':
          description: Unauthorized
        '404':
          description: Not found

  # ─── Placement ────────────────────────────────────
  /api/placement/questions:
    get:
      summary: Get placement questions
      tags: [Placement]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Questions list
        '401':
          description: Unauthorized

  /api/placement/submit:
    post:
      summary: Submit placement test
      tags: [Placement]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers: { type: array, items: {} }
      responses:
        '200':
          description: Result (score, assigned level)
        '401':
          description: Unauthorized

  /api/placement/result:
    get:
      summary: Get placement result
      tags: [Placement]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Last result
        '401':
          description: Unauthorized

  # ─── Games ─────────────────────────────────────────
  /api/games/level/{levelId}:
    get:
      summary: Get games for level
      tags: [Games]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: levelId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Games list
        '401':
          description: Unauthorized

  /api/games/{id}:
    get:
      summary: Get game by ID
      tags: [Games]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Game with questions
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/games/{id}/submit:
    post:
      summary: Submit game answers
      tags: [Games]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers: { type: array, items: {} }
      responses:
        '200':
          description: Score and result
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/games/{id}/progress:
    get:
      summary: Get game progress
      tags: [Games]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Progress object
        '401':
          description: Unauthorized
        '404':
          description: Not found

  # ─── Quiz ─────────────────────────────────────────
  /api/quiz/level/{id}:
    get:
      summary: Get quiz for level
      tags: [Quiz]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Quiz with questions
        '401':
          description: Unauthorized
        '404':
          description: Not found
    post:
      summary: Submit quiz for level
      tags: [Quiz]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers: { type: array, items: {} }
      responses:
        '200':
          description: Score and passed/failed
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/quiz/level/{id}/attempts:
    get:
      summary: Get quiz attempts for level
      tags: [Quiz]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Attempts list
        '401':
          description: Unauthorized

  # ─── AI ───────────────────────────────────────────
  /api/ai/scenarios:
    get:
      summary: Get AI scenarios
      tags: [AI]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Scenarios list
        '401':
          description: Unauthorized

  /api/ai/session/start:
    post:
      summary: Start AI session
      tags: [AI]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scenarioId: { type: string }
                mode: { type: string, enum: [GUIDED, FREE] }
      responses:
        '200':
          description: Session created
        '401':
          description: Unauthorized

  /api/ai/session/{id}/message:
    post:
      summary: Send message (text or audio). Use multipart with optional audio file.
      tags: [AI]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                text: { type: string }
                audio: { type: string, format: binary }
      responses:
        '200':
          description: AI reply
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/ai/session/{id}/end:
    post:
      summary: End AI session
      tags: [AI]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Session ended
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/ai/sessions:
    get:
      summary: Get user AI sessions
      tags: [AI]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Sessions list
        '401':
          description: Unauthorized

  /api/ai/sessions/{id}:
    get:
      summary: Get AI session by ID
      tags: [AI]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Session details
        '401':
          description: Unauthorized
        '404':
          description: Not found

  # ─── Shadowing ────────────────────────────────────
  /api/shadowing/stories:
    get:
      summary: Get shadowing stories
      tags: [Shadowing]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Stories list
        '401':
          description: Unauthorized

  /api/shadowing/stories/{id}:
    get:
      summary: Get story by ID
      tags: [Shadowing]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Story details
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/shadowing/transcribe:
    post:
      summary: 'Transcribe audio (multipart, field: audio)'
      tags: [Shadowing]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio: { type: string, format: binary }
      responses:
        '200':
          description: Transcription text
        '401':
          description: Unauthorized

  /api/shadowing/compare:
    post:
      summary: Compare user audio to reference
      tags: [Shadowing]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userText: { type: string }
                referenceText: { type: string }
      responses:
        '200':
          description: Comparison result
        '401':
          description: Unauthorized

  /api/shadowing/stories/{id}/progress:
    post:
      summary: Save story progress
      tags: [Shadowing]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentStep: { type: integer }
                accuracyScore: { type: integer }
      responses:
        '200':
          description: Saved
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/shadowing/stories/{id}/complete:
    post:
      summary: Mark story complete
      tags: [Shadowing]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Marked complete
        '401':
          description: Unauthorized
        '404':
          description: Not found

  # ─── Streak ───────────────────────────────────────
  /api/streak:
    get:
      summary: Get streak
      tags: [Streak]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Streak object
        '401':
          description: Unauthorized

  /api/streak/freeze:
    post:
      summary: Use streak freeze (Premium)
      tags: [Streak]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Freeze used
        '401':
          description: Unauthorized
        '403':
          description: Premium required or no freezes left

  /api/streak/achievements:
    get:
      summary: Get achievements
      tags: [Streak]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Achievements list
        '401':
          description: Unauthorized

  # ─── Leaderboard ─────────────────────────────────
  /api/leaderboard:
    get:
      summary: Get leaderboard
      tags: [Leaderboard]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Leaderboard entries
        '401':
          description: Unauthorized

  # ─── Notifications ────────────────────────────────
  /api/notifications:
    get:
      summary: Get notifications
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Notifications list
        '401':
          description: Unauthorized

  /api/notifications/read-all:
    post:
      summary: Mark all notifications as read
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  /api/notifications/{id}/read:
    post:
      summary: Mark notification as read
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/notifications/unread-count:
    get:
      summary: Get unread count
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: { count: number }
        '401':
          description: Unauthorized

  # ─── Certificate ─────────────────────────────────
  /api/certificate/generate:
    post:
      summary: Generate certificate (Premium)
      tags: [Certificate]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Certificate generated
        '401':
          description: Unauthorized
        '403':
          description: Premium required

  /api/certificate:
    get:
      summary: Get my certificate
      tags: [Certificate]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Certificate object or null
        '401':
          description: Unauthorized

  /api/certificate/verify/{code}:
    get:
      summary: Verify certificate by code (public)
      tags: [Certificate]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Certificate validity and holder info
        '404':
          description: Not found

  # ─── Referral ─────────────────────────────────────
  /api/referral/my-code:
    get:
      summary: Get my referral code
      tags: [Referral]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Referral code
        '401':
          description: Unauthorized

  /api/referral/stats:
    get:
      summary: Get referral stats
      tags: [Referral]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Referral stats
        '401':
          description: Unauthorized

  # ─── Subscription ─────────────────────────────────
  /api/subscription:
    get:
      summary: Get current subscription
      tags: [Subscription]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Subscription or null
        '401':
          description: Unauthorized

  /api/subscription/subscribe:
    post:
      summary: Subscribe to plan
      tags: [Subscription]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plan: { type: string, enum: [PREMIUM, FREE] }
                interval: { type: string }
      responses:
        '200':
          description: Subscription created
        '401':
          description: Unauthorized

  /api/subscription/cancel:
    post:
      summary: Cancel subscription
      tags: [Subscription]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cancelled
        '401':
          description: Unauthorized

  # ─── Blog ─────────────────────────────────────────
  /api/blog:
    get:
      summary: List blog posts (optional auth)
      tags: [Blog]
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Posts list

  /api/blog/categories:
    get:
      summary: Get categories
      tags: [Blog]
      responses:
        '200':
          description: Categories list

  /api/blog/{slug}:
    get:
      summary: Get post by slug (optional auth)
      tags: [Blog]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Post details
        '404':
          description: Not found

  # ─── Admin ────────────────────────────────────────
  /api/admin/users/users:
    get:
      summary: '[Admin] List users'
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
        - name: plan
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Users list
        '401':
          description: Unauthorized
        '403':
          description: Admin required

  /api/admin/users/users/{id}:
    get:
      summary: '[Admin] Get user by ID'
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User details
        '401':
          description: Unauthorized
        '403':
          description: Admin required
        '404':
          description: Not found
    patch:
      summary: '[Admin] Update user'
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
